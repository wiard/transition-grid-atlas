simulation:
  grid_size: 41
  steps: 96
  t_max_steps: 96
  dt: 0.25
  hopping: 1.0
  initial_site: center
  feedback_smoothing: 1.0
  fit_start_step: 4
  fit_end_step: 48
  validation_tolerance: 1.0e-12

parameters:
  W: 2.34930082765898
  bias: 0.1276120391667744
  eta: 0.7267287058773785
  gamma: 0.0
  seed: 42

montecarlo:
  runs: 100
  base_seed: 1000
  vary:
    W_std: 0.60
    bias_std: 0.05
    eta_std: 0.20
    gamma_std: 0.08

sweep:
  W_values: [0.0, 0.5, 1.0, 1.5, 2.0, 3.0, 4.0, 5.0, 6.5, 8.0, 10.0]
  bias_values: [0.0, 0.05, 0.10, 0.15, 0.20]
  eta_values: [0.0, 0.2, 0.5, 0.8, 1.1, 1.4, 1.8]
  gamma_values: [0.0, 0.02, 0.10, 0.30]
  phase_map_axes: [W, eta]
  phase_metric: alpha
  phase_valid_only: true
  boundary_detection:
    high_alpha_threshold: 0.8
    low_alpha_threshold: 0.2

hunter:
  target_alpha: 0.5
  rounds: 5
  samples_per_round: 36
  shrink_factor: 0.45
  search_center:
    W: 4.0
    bias: 0.10
    eta: 0.90
    gamma: 0.05
  search_span:
    W: 8.0
    bias: 0.24
    eta: 1.80
    gamma: 0.30
